<!DOCTYPE html>
<html lang="pt-br">

<head>

  <!-- settings -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detona Ralph</title>
  <link rel="icon" href="./src/images/favicon.jpg">

  <!-- fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Press+Start+2P&display=swap" rel="stylesheet">

  <!-- styles -->
  <link rel="stylesheet" href="./src/styles/reset.css">
  <link rel="stylesheet" href="./src/styles/main.css">
</head>

<body>

  <div class="container">
    <div class="menu">
      <div class="menu-time">
        <h2 class="menu-label">Time Left</h2>
        <h2 id="time-left">60</h2>
      </div>
      <div class="menu-score">
        <h2 class="menu-label">Your Score</h2>
        <h2 id="score">0</h2>
      </div>
      <div class="menu-best">
        <h2 class="menu-label">Best</h2>
        <h2 id="best-score">0</h2>
      </div>
      <div class="menu-lives">
        <img src="./src/images/player.png" alt="foto do jogador" height="60px" />
        <h2 id="lives">x3</h2>
      </div>
    </div>

    <div class="panel">
      <div class="panel-row">
        <div class="square" id="1"></div>
        <div class="square" id="2"></div>
        <div class="square" id="3"></div>
      </div>

      <div class="panel-row">
        <div class="square" id="4"></div>
        <div class="square" id="5"></div>
        <div class="square" id="6"></div>
      </div>

      <div class="panel-row">
        <div class="square" id="7"></div>
        <div class="square" id="8"></div>
        <div class="square" id="9"></div>
      </div>
    </div>

    <button id="pause-button" type="button" disabled>Pausar (P)</button>
  </div>

  <!-- tela de início / fim de jogo -->
  <div class="overlay" id="overlay">
    <div class="overlay-box">
      <h1 id="overlay-title">Detona Ralph</h1>
      <p id="overlay-text">Clique no quadrado onde o Ralph aparecer. Errar custa uma vida!</p>

      <div class="difficulty" id="difficulty">
        <div class="difficulty-options">
          <button type="button" class="difficulty-btn" data-level="facil" aria-pressed="false">Fácil</button>
          <button type="button" class="difficulty-btn" data-level="normal" aria-pressed="true">Normal</button>
          <button type="button" class="difficulty-btn" data-level="dificil" aria-pressed="false">Difícil</button>
        </div>
        <p id="difficulty-info"></p>
      </div>

      <button id="start-button" type="button">Jogar</button>
    </div>
  </div>

  <script defer src="./src/scripts/engine.js"></script>
</body>

</html>
